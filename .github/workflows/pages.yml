name: Deploy Pages

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages-preflight:
    name: Pages preflight
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check repository Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$({
            curl --silent --show-error               --output /tmp/pages.json               --write-out '%{http_code}'               --header "Authorization: Bearer $GH_TOKEN"               --header "Accept: application/vnd.github+json"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          })"

          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              {
                echo "## GitHub Pages is not enabled yet"
                echo
                echo "Enable **Settings → Pages → Build and deployment → Source: GitHub Actions** once for this repository."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              cat /tmp/pages.json >&2 || true
              echo "Unexpected GitHub Pages API status: $status" >&2
              exit 1
              ;;
          esac

  nlp-wasm:
    name: Reuse validated NLP WASM
    needs: pages-preflight
    if: ${{ needs.pages-preflight.outputs.enabled == 'true' }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@7533380c9468a1ec5504f5e56888bf4a45009317
    with:
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      artifact_key: document-search-nlp-wasm-v1
      bun_version: "1.3.14"
      rust_toolchain: "1.95.0"
      rust_targets: wasm32-unknown-unknown
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      cargo_tool_cache_key: rust-1.95.0-wasm-pack-0.14.0
      use_environment_v1: false
      setup_command: |
        set -euo pipefail
        revision="$(tr -d '[:space:]' < .nlp-stack-rev)"
        rm -rf ../nlp-stack
        git init ../nlp-stack
        git -C ../nlp-stack fetch --depth=1 https://github.com/moritzbrantner/nlp-stack.git "$revision"
        git -C ../nlp-stack checkout --detach FETCH_HEAD
        cargo install wasm-pack --locked --version 0.14.0
      build_command: |
        set -euo pipefail
        ./scripts/setup-source-deps
        rm -rf .artifacts/nlp-wasm
        mkdir -p .artifacts/nlp-wasm
        cp -R ../nlp-stack/packages/text-core-wasm/pkg .artifacts/nlp-wasm/text-core-wasm
        cp -R ../nlp-stack/packages/text-index-wasm/pkg .artifacts/nlp-wasm/text-index-wasm
      artifact_paths: .artifacts/nlp-wasm
      reuse_across_runs: true
      expected_consumers: 2
      artifact_retention_days: 7
      timeout_minutes: 30

  deploy-pages:
    name: Compose and deploy Pages
    needs:
      - pages-preflight
      - nlp-wasm
    if: ${{ needs.pages-preflight.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.nlp-wasm.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Check out exact nlp-stack source
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < .nlp-stack-rev)"
          git init ../nlp-stack
          git -C ../nlp-stack fetch --depth=1 https://github.com/moritzbrantner/nlp-stack.git "$revision"
          git -C ../nlp-stack checkout --detach FETCH_HEAD
          test "$(git -C ../nlp-stack rev-parse HEAD)" = "$revision"

      - name: Consume verified NLP WASM
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@7533380c9468a1ec5504f5e56888bf4a45009317
        with:
          producer_run_id: ${{ needs.nlp-wasm.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.nlp-wasm.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.nlp-wasm.outputs.artifact_name }}
          artifact_digest: ${{ needs.nlp-wasm.outputs.artifact_digest }}
          source_sha: ${{ needs.nlp-wasm.outputs.source_sha }}
          artifact_key: ${{ needs.nlp-wasm.outputs.artifact_key }}
          identity_digest: ${{ needs.nlp-wasm.outputs.identity_digest }}
          destination_path: .artifacts/verified-nlp-wasm
          github_token: ${{ github.token }}

      - name: Prepare source dependencies from verified WASM
        env:
          DOCUMENT_SEARCH_PREBUILT_NLP_WASM_DIR: ${{ github.workspace }}/.artifacts/verified-nlp-wasm
        run: ./scripts/setup-source-deps

      - name: Typecheck Pages composition
        run: bun run typecheck

      - name: Build Pages composition
        run: bunx vite build --base=/document-search/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
