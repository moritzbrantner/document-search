name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  pages: write
  id-token: write

jobs:
  pages-preflight:
    name: Pages preflight
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check repository Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$({
            curl --silent --show-error \
              --output /tmp/pages.json \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          })"

          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              {
                echo "## GitHub Pages is not enabled yet"
                echo
                echo "Enable **Settings → Pages → Build and deployment → Source: GitHub Actions** once for this repository."
                echo "After that, the next push to main (or a manual workflow dispatch) will deploy automatically."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              cat /tmp/pages.json >&2 || true
              echo "Unexpected GitHub Pages API status: $status" >&2
              exit 1
              ;;
          esac

  deploy-pages:
    name: Deploy Pages
    needs: pages-preflight
    if: ${{ needs.pages-preflight.outputs.enabled == 'true' }}
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@197a252fcfc3d4a631010c61ef77369f5461365c
    with:
      node_version: "24"
      bun_version: "1.3.14"
      install_command: ""
      pre_command: |
        set -euo pipefail
        git clone --filter=blob:none https://github.com/moritzbrantner/nlp-stack.git ../nlp-stack
        git -C ../nlp-stack checkout "$(cat .nlp-stack-rev)"
        rustup toolchain install 1.95.0 --profile minimal
        rustup target add wasm32-unknown-unknown --toolchain 1.95.0
        cargo +1.95.0 install wasm-pack --locked --version 0.14.0
        ./scripts/setup-source-deps
      build_command: "bun run typecheck && bunx vite build --base=/document-search/"
      artifact_path: dist
