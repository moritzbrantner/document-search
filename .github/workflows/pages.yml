name: Deploy Pages

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages-preflight:
    name: Pages preflight
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check repository Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$({
            curl --silent --show-error \
              --output /tmp/pages.json \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          })"

          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              {
                echo "## GitHub Pages is not enabled yet"
                echo
                echo "Enable **Settings → Pages → Build and deployment → Source: GitHub Actions** once for this repository."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              cat /tmp/pages.json >&2 || true
              echo "Unexpected GitHub Pages API status: $status" >&2
              exit 1
              ;;
          esac

  deploy-pages:
    name: Compose and deploy Pages
    needs: pages-preflight
    if: ${{ needs.pages-preflight.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # @moritzbrantner/nlp-stack-wasm builds its WASM from a pinned nlp-stack commit on install
      # (prepare script): it needs the Rust toolchain, the wasm32 target and wasm-pack.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache wasm-pack
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/nlp-stack-wasm
          key: nlp-stack-wasm-wasm-pack-0.14.0-${{ runner.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Pages composition
        run: bun run typecheck

      - name: Build Pages composition
        run: bunx vite build --base=/document-search/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
