name: Format probe

on:
  pull_request:
    paths:
      - ".github/workflows/format-probe.yml"
      - "src/demo/demoCorpus.ts"
      - "src/domain/documentImport.ts"
      - "src/storage/indexedDbStore.ts"
      - "src/test/documentImport.test.ts"
      - "src/test/indexedDbStore.test.ts"

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Print exact formatter patch
        run: |
          set -euo pipefail
          bunx oxfmt@0.54.0 --write \
            src/demo/demoCorpus.ts \
            src/domain/documentImport.ts \
            src/storage/indexedDbStore.ts \
            src/test/documentImport.test.ts \
            src/test/indexedDbStore.test.ts
          git diff -- \
            src/demo/demoCorpus.ts \
            src/domain/documentImport.ts \
            src/storage/indexedDbStore.ts \
            src/test/documentImport.test.ts \
            src/test/indexedDbStore.test.ts
