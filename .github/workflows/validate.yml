name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Show canonical formatter diff
        run: |
          bunx oxfmt@0.54.0 --write src/domain/documentImport.ts
          git --no-pager diff -- src/domain/documentImport.ts
          exit 1

      - name: Prepare pinned nlp-stack source
        run: |
          git clone --filter=blob:none https://github.com/moritzbrantner/nlp-stack.git ../nlp-stack
          git -C ../nlp-stack checkout "$(cat .nlp-stack-rev)"
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cargo +1.95.0 install wasm-pack --locked --version 0.14.0
          ./scripts/setup-source-deps

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
